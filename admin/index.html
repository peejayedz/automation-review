<!doctype html>
<html lang="en" class="lfmp-v2">
<head>
<meta charset="utf-8">
<script>/* The tool runs only on the team site (lfmp-admin.pages.dev, behind Google sign-in). On the public site (github.io, lawfirmmarketingpros.com) this address shows the "Moved" page instead. */ if (/(^|\.)(github\.io|lawfirmmarketingpros\.com)$/.test(location.hostname)) location.replace('moved.html' + location.search);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Review admin · LFMP</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0c'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%23d9a64e' stroke-width='2'/%3E%3Cpath d='m9 16.5 4.5 4.5L23 11.5' fill='none' stroke='%23d9a64e' stroke-width='3'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem('lfmp-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="preload" href="fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="lfmp-ui.css?v=2.3.0">
<link rel="stylesheet" href="admin.css?v=1.11.0">
<script src="../config.js"></script>
</head>
<body>

<!-- Sign-in worked but the page can't run (no backend set, or the team site answered with an error) -->
<div class="gate" id="setupView" hidden><div class="card">
  <div class="gatehead"><span class="mark" aria-hidden="true">LFMP</span><p class="ey">LFMP · Review admin</p></div>
  <h1 class="disp">Review admin <span class="g">not ready.</span></h1>
  <p class="sub" id="setupMsg">Loading…</p>
  <div class="btnrow"><button class="btn big" type="button" data-act="signout">Sign out</button></div>
</div></div>

<!-- App. v2 (redesign v2): the top bar, the Me menu (theme, test clients, refresh, team sign-ins, what's new, install,
     Submissions, sign out) and the phone's bottom tabs come from lfmp-session.js mountShell(), the same in all three tools. -->
<div id="appView" hidden>
  <main class="lv-in" id="screen" aria-live="polite"></main>
</div>

<div class="dshade" id="dpShade" hidden></div>
<aside class="dpanel" id="dPanel" role="dialog" aria-modal="true" aria-labelledby="dpTitle" hidden></aside>
<div class="ovl" id="ovl" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="admin.js?v=1.11.0"></script>
</body>
</html>
