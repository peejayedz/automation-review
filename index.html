<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Automation Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#16202B; --muted:#5B6775; --line:#DCE2E9; --soft:#F5F7FA;
  --accent:#1D4E89; --accent-soft:#E6EEF8;
  --ok:#13795B; --ok-soft:#E3F4EC; --warn:#9A5B00; --warn-soft:#FDF1DC; --bad:#B42318; --bad-soft:#FDECEA;
  --team:#5B3E96; --team-soft:#EFEAF8;
  --serif:"Source Serif 4", Georgia, serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1318; --paper:#161D25; --ink:#E5EAF0; --muted:#9AA6B3; --line:#2A3440; --soft:#1B232C;
    --accent:#86AEE4; --accent-soft:#1B2A3D;
    --ok:#52C79C; --ok-soft:#15302A; --warn:#E5AC55; --warn-soft:#33281A; --bad:#F08A7E; --bad-soft:#3A1E1C;
    --team:#B79CF0; --team-soft:#2A2340;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{font-size:13px;color:var(--muted)}
.brand b{color:var(--ink);font-size:15px;display:block}
.autotabs{display:flex;gap:6px;flex-wrap:wrap}
.autotabs a{font-size:14px;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:7px;border:1px solid transparent;display:inline-flex;gap:8px;align-items:center}
.autotabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.dot.approved{background:var(--ok)} .dot.changes{background:var(--warn)} .dot.pending{background:var(--accent)}
.banner{font-size:13px;background:var(--warn-soft);color:var(--ink);padding:8px 16px;text-align:center}
.hero{padding-block:26px 18px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-family:var(--serif);font-size:34px;line-height:1.15;margin:6px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.lead{font-size:17px;max-width:62ch;margin:12px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--accent-soft);color:var(--accent)}
.pill.changes{background:var(--warn-soft);color:var(--warn)}
.pill.updated{background:var(--team-soft);color:var(--team)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.none{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.progress{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.bar{height:8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin:10px 0 8px;display:flex}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.howto{font-size:13px;color:var(--muted);margin:10px 0 0;padding:0 0 0 18px}
.glance{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.glance div{background:var(--paper);padding:12px 14px;font-size:14px}
.glance b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:22px;align-items:start}
.flow{display:flex;flex-direction:column}
.dayhead{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.dayhead:first-child{margin-top:0}
.node{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.node:hover{border-color:var(--accent)}
.node[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node.team{background:var(--team-soft);border-color:transparent}
.node.team[aria-pressed="true"]{border-color:var(--team)}
.node.startend{background:var(--soft)}
.icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.node.team .icon{background:var(--paper);color:var(--team)}
.node.startend .icon{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.icon svg{width:20px;height:20px}
.ntitle{font-weight:600;font-size:15px;line-height:1.3}
.nsub{font-size:13px;color:var(--muted);margin-top:2px}
.conn{display:flex;align-items:center;gap:10px;height:30px;margin-left:33px;padding-left:18px;border-left:2px dotted var(--line);font-size:12px;color:var(--muted)}
.inspector{position:sticky;top:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;max-height:calc(100vh - 32px);overflow:auto}
.inspector.inline{position:static;max-height:none;margin:10px 0 4px;border-color:var(--accent)}
.ihead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.inspector h2{font-family:var(--serif);font-size:22px;line-height:1.25;margin:6px 0 8px}
.inspector p{margin:0 0 10px}
.sms{background:var(--soft);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;white-space:pre-line;font-size:14.5px}
.email{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14.5px}
.email .subj{background:var(--soft);padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.email .body{padding:12px;white-space:pre-line}
.pendingtxt{color:var(--muted);font-style:italic}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;white-space:nowrap}
.len{font-size:12px;color:var(--muted);margin-top:6px}
.note{font-size:13px;margin-top:12px;padding:9px 12px;border-radius:8px;background:var(--warn-soft)}
.note b{color:var(--warn)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.edit[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;gap:8px;margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px}
.form label{font-size:13px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea,input[type=text],input[type=email]{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);font-size:14px}
textarea{resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.hint{font-size:12px;color:var(--muted)}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.hist h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hitem{border-left:3px solid var(--line);padding:4px 0 8px 10px;margin-bottom:8px;font-size:13px}
.hitem.approve{border-color:var(--ok)} .hitem.change{border-color:var(--warn)} .hitem.copy{border-color:var(--accent)}
.hitem .who{font-weight:600}
.hitem .when{color:var(--muted)}
.hitem .copytxt{white-space:pre-line;background:var(--soft);border-radius:6px;padding:6px 8px;margin-top:4px}
.hitem .reply{margin-top:4px;color:var(--team)}
.hitem .old{opacity:.7}
.section{margin-top:34px}
.section h2{font-family:var(--serif);font-size:24px;margin-bottom:6px}
.qs{display:grid;gap:10px;margin-top:12px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.q p{margin:0}
.approveall{background:var(--paper);border:2px solid var(--accent);border-radius:14px;padding:20px;margin-top:12px;display:grid;gap:10px;max-width:720px}
.approveall.done{border-color:var(--ok);background:var(--ok-soft)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{margin:40px 0 30px;font-size:12px;color:var(--muted)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  #sideInspector{display:none}
  .glance{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .hero h1{font-size:27px}
  .row2{grid-template-columns:1fr}
  .node{grid-template-columns:34px minmax(0,1fr);}
  .node .pill{grid-column:2;justify-self:start}
  .icon{width:34px;height:34px}
  .conn{margin-left:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>
</head>
<body>
<div id="banner" class="banner" hidden></div>
<header class="top"><div class="wrap topin">
  <div class="brand"><b id="clientName">Automation Review</b><span id="clientSub">Law Firm Marketing Pros</span></div>
  <nav class="autotabs" id="autotabs" aria-label="Automations"></nav>
</div></header>

<main class="wrap" id="app">
  <div class="empty">Loading your review…</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const CFG = window.REVIEW_CONFIG || {};
const SAVE_URL = (CFG.saveUrl || "").trim();
const params = new URLSearchParams(location.search);
const clientKey = (params.get("c") || "").replace(/[^a-z0-9-]/gi, "");
let autoId = params.get("a") || "";

let data = null, auto = null, responses = [], selected = null, openForm = null, chipChoice = {};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chips = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<span class="chip">$1</span>');
const fmt = (iso) => { try { return new Date(iso).toLocaleString("en-US", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); } catch(e) { return ""; } };

/* ---------- reviewer identity (per browser) ---------- */
function getReviewer(){ try { return JSON.parse(localStorage.getItem("ar_reviewer") || "{}"); } catch(e){ return {}; } }
function setReviewer(r){ try { localStorage.setItem("ar_reviewer", JSON.stringify(r)); } catch(e){} }

/* ---------- storage: Google Sheet via Apps Script, or demo (this browser) ---------- */
const demoKey = "ar_demo_" + clientKey;
async function loadResponses(){
  if (!SAVE_URL){
    try { return JSON.parse(localStorage.getItem(demoKey) || "[]"); } catch(e){ return []; }
  }
  const res = await fetch(SAVE_URL + "?client=" + encodeURIComponent(clientKey) + "&t=" + Date.now());
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Could not load responses");
  return j.rows || [];
}
async function saveResponse(rec){
  if (!SAVE_URL){
    const all = await loadResponses(); rec.id = "demo-" + Date.now(); rec.timestamp = new Date().toISOString(); rec.status = "Open";
    all.push(rec); try { localStorage.setItem(demoKey, JSON.stringify(all)); } catch(e){}
    return rec;
  }
  const res = await fetch(SAVE_URL, { method:"POST", body: JSON.stringify(rec) }); // text/plain: no CORS preflight
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Could not save");
  return j.row;
}

/* ---------- derived state ---------- */
// Google Sheets can turn "1.0" into the number 1, so compare versions both as text and as numbers.
const sameV = (a, b) => String(a) === String(b) || (a !== "" && b !== "" && Number(a) === Number(b));
const mine = () => responses.filter(r => r.automation === auto.id);
const cur = () => mine().filter(r => sameV(r.version, auto.version));
function stepState(stepId){
  const rs = cur().filter(r => r.step === stepId && ["approve","change","copy"].includes(r.action));
  if (!rs.length) return "pending";
  const last = rs[rs.length - 1];
  const openReq = rs.some(r => (r.action === "change" || r.action === "copy") && r.status !== "Done");
  if (openReq) return "changes";
  if (last.action === "approve") return "approved";
  return "updated"; // requests done by LFMP, client hasn't re-approved
}
const stateLabel = {pending:"Needs your review", changes:"Changes requested", updated:"Updated, please re-check", approved:"Looks good"};
function autoState(a){
  const rs = responses.filter(r => r.automation === a.id && sameV(r.version, a.version));
  if (rs.some(r => r.action === "approve_all")) return "approved";
  if (rs.some(r => (r.action === "change" || r.action === "copy") && r.status !== "Done")) return "changes";
  return "pending";
}
const reviewable = () => auto.steps.filter(s => s.type !== "start");

/* ---------- icons ---------- */
const ICON = {
  sms:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  call:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  vm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6.5" cy="12" r="3.5"/><circle cx="17.5" cy="12" r="3.5"/><path d="M6.5 15.5h11"/></svg>',
  team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 11a3 3 0 1 0 0-6M21 20a6 6 0 0 0-4-5.6"/></svg>',
  start:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l12-8z"/></svg>',
  end:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};
const TYPE = {sms:"Text message", email:"Email", call:"Phone call", vm:"Voicemail", team:"Team action", start:"Start", end:"End"};

/* ---------- render ---------- */
function render(){
  $("#clientName").textContent = data.client.name + " · Automation Review";
  $("#clientSub").textContent = "Prepared by " + data.lfmpContact;
  document.title = auto.name + " · " + data.client.name;
  $("#autotabs").innerHTML = data.automations.map(a =>
    `<a href="?c=${encodeURIComponent(clientKey)}&a=${encodeURIComponent(a.id)}" data-auto="${esc(a.id)}" ${a.id===auto.id?'aria-current="page"':''}><span class="dot ${autoState(a)}"></span>${esc(a.name)}</a>`).join("");

  const steps = reviewable();
  const counts = {approved:0, changes:0, updated:0, pending:0};
  steps.forEach(s => counts[stepState(s.id)]++);
  const pct = (n) => (100 * n / steps.length) + "%";
  const as = autoState(auto);
  const asPill = as === "approved" ? '<span class="pill approved">Approved</span>' : as === "changes" ? '<span class="pill changes">Changes requested</span>' : '<span class="pill pending">Needs your review</span>';

  let html = `<section class="hero">
    <div>
      <div class="eyebrow">Automation ${data.automations.indexOf(auto)+1} of ${data.automations.length}</div>
      <h1>${esc(auto.name)}</h1>
      <div class="meta">${asPill}<span>Version ${esc(auto.version)}</span><span>Sent ${esc(auto.sent)}</span></div>
      <p class="lead">${esc(auto.summary)}</p>
    </div>
    <div class="progress">
      <b>${counts.approved + counts.changes} of ${steps.length} steps reviewed</b>
      <div class="bar" aria-hidden="true"><span style="width:${pct(counts.approved)};background:var(--ok)"></span><span style="width:${pct(counts.changes)};background:var(--warn)"></span><span style="width:${pct(counts.updated)};background:var(--team)"></span></div>
      <div class="legend"><span><i class="dot approved"></i>${counts.approved} looks good</span><span><i class="dot changes"></i>${counts.changes} changes</span>${counts.updated?`<span><i class="dot" style="background:var(--team)"></i>${counts.updated} updated</span>`:""}<span><i class="dot"></i>${counts.pending} to review</span></div>
      <ol class="howto"><li>Click a step to see exactly what's sent.</li><li>Mark it <b>Looks good</b>, <b>Request a change</b> or <b>Edit the wording</b>.</li><li>Approve the automation at the bottom.</li></ol>
    </div>
  </section>
  <div class="glance">${auto.glance.map(g => `<div><b>${esc(g[0])}</b>${chips(g[1])}</div>`).join("")}</div>
  <div class="main">
    <div class="flow" id="flow">${flowHTML()}</div>
    <aside id="sideInspector" aria-live="polite">${selected && !matchMedia("(max-width:980px)").matches ? `<div class="inspector">${inspectorHTML()}</div>` : ""}</aside>
  </div>
  ${questionsHTML()}
  ${approveHTML()}
  <p class="foot">Your responses are saved as soon as you click, and the LFMP team sees them right away. You can come back to this page any time to see where each change stands.</p>`;
  $("#app").innerHTML = html;
}

function flowHTML(){
  const narrow = matchMedia("(max-width:980px)").matches;
  let h = "", lastDay = "";
  auto.steps.forEach((s) => {
    if (s.day !== lastDay){ h += `<div class="dayhead">${esc(s.day)}</div>`; lastDay = s.day; }
    else if (s.gap){ h += `<div class="conn">${esc(s.gap)}</div>`; }
    const st = s.type === "start" ? null : stepState(s.id);
    const cls = (s.type === "team" || s.type === "call") ? "team" : (s.type === "start" || s.type === "end") ? "startend" : "";
    const who = s.who === "patient" ? " · Patient receives" : s.who === "team" ? " · Your team" : "";
    h += `<button class="node ${cls}" data-step="${esc(s.id)}" aria-pressed="${selected===s.id}">
      <span class="icon">${ICON[s.type]||""}</span>
      <span><span class="ntitle">${chips(s.title)}</span><span class="nsub" style="display:block">${(s.type==="start"||s.type==="end") ? TYPE[s.type] : esc(s.when) + " · " + TYPE[s.type] + who}</span></span>
      ${st ? `<span class="pill ${st==="approved"?"approved":st==="changes"?"changes":st==="updated"?"updated":"none"}">${stateLabel[st]}</span>` : ""}
    </button>`;
    if (narrow && selected === s.id) h += `<div class="inspector inline">${inspectorHTML()}</div>`;
  });
  return h;
}

function inspectorHTML(){
  const s = auto.steps.find(x => x.id === selected); if (!s) return "";
  const st = s.type === "start" ? null : stepState(s.id);
  let content = "";
  if (s.body) content += `<p>${chips(s.body)}</p>`;
  if (s.sms){
    const len = s.sms.replace(/\[[^\]]+\]/g, "Maria").length;
    content += `<div class="sms">${chips(s.sms)}</div><div class="len">About ${Math.round(len/10)*10} characters with names filled in${len>160?` · sends as ${Math.ceil(len/153)} text segments`:""}</div>`;
  }
  if (s.email){
    content += `<div class="email"><div class="subj"><b>Subject:</b> ${chips(s.email.subject)}</div><div class="body">${s.email.body ? chips(s.email.body) : `<span class="pendingtxt">${esc(s.email.pending||"")}</span>`}</div></div>`;
  }
  if (s.note) content += `<div class="note"><b>Our note:</b> ${chips(s.note)}</div>`;

  const hasCopy = !!(s.sms || (s.email && s.email.body));
  const locked = autoState(auto) === "approved";
  let actions = "";
  if (s.type !== "start" && !locked){
    actions = `<div class="actions">
      <button class="btn ok" data-act="approve">✓ Looks good</button>
      <button class="btn warn" data-act="change" aria-pressed="${openForm==="change"}">Request a change</button>
      ${hasCopy ? `<button class="btn edit" data-act="copy" aria-pressed="${openForm==="copy"}">Edit the wording</button>` : ""}
    </div>${formHTML(s)}`;
  }
  const hist = mine().filter(r => r.step === s.id && ["approve","change","copy"].includes(r.action)).slice().reverse();
  const histHTML = hist.length ? `<div class="hist"><h3>Responses on this step</h3>${hist.map(r => `
     <div class="hitem ${r.action} ${!sameV(r.version, auto.version)?"old":""}">
       <span class="who">${esc(r.name||"Someone")}</span> <span class="when">· ${fmt(r.timestamp)}${!sameV(r.version, auto.version)?" · v"+esc(r.version):""}</span>
       <div>${r.action==="approve"?"Marked this step as looks good":r.action==="copy"?"Suggested new wording":esc(r.type||"Requested a change")}${r.action!=="approve"?` · <b>${esc(r.status||"Open")==="Done"?"Done":esc(r.status||"Open")}</b>`:""}</div>
       ${r.details?`<div>${esc(r.details)}</div>`:""}
       ${r.new_copy?`<div class="copytxt">${esc(r.new_copy)}</div>`:""}
       ${r.lfmp_reply?`<div class="reply">LFMP: ${esc(r.lfmp_reply)}</div>`:""}
     </div>`).join("")}</div>` : "";
  return `<div class="ihead">${ICON[s.type]?`<span class="icon" style="width:28px;height:28px">${ICON[s.type]}</span>`:""}<span>${esc(s.day)} · ${esc(s.when)} · ${TYPE[s.type]}</span>${st?`<span class="pill ${st==="approved"?"approved":st==="changes"?"changes":st==="updated"?"updated":"none"}">${stateLabel[st]}</span>`:""}</div>
    <h2>${chips(s.title)}</h2>${content}${actions}${histHTML}`;
}

function whoFields(p){
  p = p || "rv"; const r = getReviewer();
  return `<div class="row2"><div><label for="${p}-name">Your name</label><input type="text" id="${p}-name" data-who="name" autocomplete="name" value="${esc(r.name||"")}"></div>
   <div><label for="${p}-email">Email <span class="hint">(optional)</span></label><input type="email" id="${p}-email" data-who="email" autocomplete="email" value="${esc(r.email||"")}"></div></div>`;
}
function formHTML(s){
  if (openForm === "who"){
    return `<form class="form" data-form="who"><span class="hint" style="font-size:13px">So we know who reviewed it. We'll remember you on this device.</span>${whoFields()}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ok" type="submit">✓ Mark as looks good</button><button class="btn" type="button" data-cancel>Cancel</button></div></form>`;
  }
  if (openForm === "change"){
    const kinds = ["Change timing","Remove this step","Add a step after this","Notify someone here","Something else"];
    const pick = chipChoice[s.id] || kinds[0];
    return `<form class="form" data-form="change">
      <label>What would you like changed?</label>
      <div class="chips" role="group" aria-label="Type of change">${kinds.map(k=>`<button type="button" data-kind="${esc(k)}" aria-pressed="${k===pick}">${k}</button>`).join("")}</div>
      <label for="f-details">Details</label>
      <textarea id="f-details" rows="3" required placeholder="e.g. Send this 3 days after instead of the next day"></textarea>
      ${whoFields()}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">Send request</button><button class="btn" type="button" data-cancel>Cancel</button></div>
    </form>`;
  }
  if (openForm === "copy"){
    const orig = s.sms || (s.email && s.email.body) || "";
    return `<form class="form" data-form="copy">
      <label for="f-copy">Your wording</label>
      <textarea id="f-copy" rows="${Math.min(12, orig.split("\n").length + 4)}" required>${esc(orig)}</textarea>
      <span class="hint">Edit the text directly. Keep words in [brackets] where you want names filled in.</span>
      <label for="f-details">Anything else? <span class="hint">(optional)</span></label>
      <input type="text" id="f-details" placeholder="e.g. Please sign it from Dr. Lee">
      ${whoFields()}
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit">Save new wording</button><button class="btn" type="button" data-cancel>Cancel</button></div>
    </form>`;
  }
  return "";
}

function questionsHTML(){
  if (!auto.questions || !auto.questions.length) return "";
  const ans = (qid) => { const rs = cur().filter(r => r.action === "answer" && r.step === qid); return rs.length ? rs[rs.length-1] : null; };
  return `<section class="section"><h2>${auto.questions.length} question${auto.questions.length>1?"s":""} for you</h2>
    <p class="hint" style="font-size:14px;margin:0">We found these while documenting the automation. Your answers decide whether we change anything before it goes live.</p>
    ${getReviewer().name ? "" : `<div class="form" id="q-who" style="max-width:560px">${whoFields("q")}</div>`}
    <div class="qs">${auto.questions.map((q,i) => { const a = ans(q.id); return `<div class="q">
      <p><b>${i+1}. ${esc(q.text)}</b></p><p class="hint">${esc(q.why)}</p>
      <div class="chips" role="group" aria-label="Answer ${i+1}">${q.options.map(o => `<button type="button" data-q="${esc(q.id)}" data-a="${esc(o)}" aria-pressed="${a&&a.details===o}">${esc(o)}</button>`).join("")}</div>
      ${a?`<span class="hint">Saved · ${esc(a.name||"")} · ${fmt(a.timestamp)}${a.lfmp_reply?` · LFMP: ${esc(a.lfmp_reply)}`:""}</span>`:""}
    </div>`; }).join("")}</div></section>`;
}

function approveHTML(){
  const rs = cur().filter(r => r.action === "approve_all");
  if (rs.length){
    const a = rs[rs.length-1];
    return `<section class="section"><h2>Approval</h2><div class="approveall done"><b>Approved by ${esc(a.name)} on ${fmt(a.timestamp)}</b><span>Version ${esc(auto.version)} of ${esc(auto.name)} is approved exactly as shown on this page. We'll turn it on and let you know when it's live.</span></div></section>`;
  }
  const open = cur().filter(r => (r.action==="change"||r.action==="copy") && r.status !== "Done").length;
  const pending = reviewable().filter(s => stepState(s.id) === "pending").length;
  return `<section class="section"><h2>Approve this automation</h2>
    <form class="approveall" data-form="approve_all">
      <span>Approving tells us version ${esc(auto.version)} can go live exactly as shown on this page.</span>
      ${open ? `<span class="pill changes" style="justify-self:start">${open} change request${open>1?"s":""} still open</span><span class="hint" style="font-size:14px">We'll update the automation and send you a new version to approve. You don't need to do anything else right now.</span>` : ""}
      ${!open && pending ? `<span class="hint" style="font-size:14px">${pending} step${pending>1?"s":""} not reviewed yet. You can still approve if you're happy with everything.</span>` : ""}
      ${whoFields("ap")}
      <label class="check"><input type="checkbox" id="ap-check" ${open?"disabled":""}> I approve ${esc(auto.name)}, version ${esc(auto.version)}.</label>
      <button class="btn primary" type="submit" ${open?"disabled":""} style="justify-self:start">Approve automation</button>
    </form></section>`;
}

/* ---------- actions ---------- */
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600); }
function readWho(scope){
  const nEl = scope && scope.querySelector('[data-who="name"]'); const eEl = scope && scope.querySelector('[data-who="email"]');
  const r = {name:((nEl&&nEl.value)||getReviewer().name||"").trim(), email:((eEl&&eEl.value)||getReviewer().email||"").trim()};
  if (r.name) setReviewer(r);
  return {r, nEl};
}
async function submit(rec, okMsg, scope){
  const {r:who, nEl} = readWho(scope);
  if (!who.name){ if (nEl){ nEl.focus(); nEl.setAttribute("aria-invalid","true"); } toast("Please add your name first"); return false; }
  Object.assign(rec, {client:clientKey, automation:auto.id, version:auto.version, name:who.name, email:who.email});
  try {
    const saved = await saveResponse(rec);
    responses.push(saved);
    toast(okMsg);
    return true;
  } catch(e){
    toast("Couldn't save. Check your connection and try again.");
    return false;
  }
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.auto){ e.preventDefault(); autoId = t.dataset.auto; auto = data.automations.find(a=>a.id===autoId); selected = null; openForm = null; history.replaceState(null,"",t.getAttribute("href")); render(); window.scrollTo(0,0); return; }
  if (t.dataset.step){ selected = selected === t.dataset.step && matchMedia("(max-width:980px)").matches ? null : t.dataset.step; openForm = null; render(); return; }
  if (t.dataset.act === "approve"){
    if (!getReviewer().name){ openForm = "who"; render(); const f = $("#rv-name"); if (f) f.focus(); return; }
    await approveStep(null); return;
  }
  if (t.dataset.act === "change" || t.dataset.act === "copy"){ openForm = openForm === t.dataset.act ? null : t.dataset.act; render(); const f = document.getElementById(openForm==="copy"?"f-copy":"f-details"); if (f) f.focus(); return; }
  if (t.hasAttribute("data-cancel")){ openForm = null; render(); return; }
  if (t.dataset.kind){ chipChoice[selected] = t.dataset.kind; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===t)); return; }
  if (t.dataset.q){
    const q = auto.questions.find(x=>x.id===t.dataset.q);
    const ok = await submit({step:q.id, step_title:q.text, action:"answer", type:"Question", details:t.dataset.a, new_copy:""}, "Answer saved", $("#q-who"));
    if (ok) render(); return;
  }
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target; const kind = f.dataset.form;
  const s = auto.steps.find(x=>x.id===selected);
  if (kind === "who"){ await approveStep(f); return; }
  if (kind === "change"){
    const d = $("#f-details").value.trim(); if (!d){ $("#f-details").focus(); return; }
    const type = chipChoice[s.id] || "Change timing";
    if (await submit({step:s.id, step_title:s.title, action:"change", type, details:d, new_copy:""}, "Change request sent", f)){ openForm = null; render(); }
  }
  if (kind === "copy"){
    const c = $("#f-copy").value.trim(); const orig = (s.sms || (s.email&&s.email.body) || "").trim();
    if (!c || c === orig){ toast("Edit the wording first, then save"); $("#f-copy").focus(); return; }
    if (await submit({step:s.id, step_title:s.title, action:"copy", type:"New wording", details:$("#f-details").value.trim(), new_copy:c}, "New wording saved", f)){ openForm = null; render(); }
  }
  if (kind === "approve_all"){
    if (!$("#ap-check").checked){ toast("Tick the box to confirm your approval"); return; }
    if (await submit({step:"all", step_title:auto.name, action:"approve_all", type:"Approval", details:"Approved version " + auto.version, new_copy:""}, "Approved. Thank you!", f)){ render(); window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}); }
  }
});
async function approveStep(scope){
  const s = auto.steps.find(x=>x.id===selected);
  const ok = await submit({step:s.id, step_title:s.title, action:"approve", type:"", details:"", new_copy:""}, "Saved: looks good", scope);
  if (!ok) return;
  const i = reviewable().findIndex(x=>x.id===s.id); const next = reviewable().slice(i+1).find(x=>stepState(x.id)==="pending");
  if (next) selected = next.id;
  openForm = null; render();
}
let wasNarrow = matchMedia("(max-width:980px)").matches;
matchMedia("(max-width:980px)").addEventListener("change", (m) => { if (m.matches !== wasNarrow){ wasNarrow = m.matches; if (data) render(); } });

/* ---------- boot ---------- */
async function boot(){
  if (!SAVE_URL){ const b = $("#banner"); b.hidden = false; b.textContent = "Demo mode: responses are saved only in this browser until the Google Sheet connection is set up."; }
  if (!clientKey){ $("#app").innerHTML = '<div class="empty">This review link is missing its client code. Please use the link LFMP sent you.</div>'; return; }
  try {
    const r = await fetch("data/" + clientKey + ".json?t=" + Date.now());
    if (!r.ok) throw new Error("not found");
    data = await r.json();
  } catch(e){ $("#app").innerHTML = '<div class="empty">We couldn\'t find this review. Please check the link LFMP sent you.</div>'; return; }
  auto = data.automations.find(a => a.id === autoId) || data.automations[0];
  try { responses = await loadResponses(); } catch(e){ responses = []; toast("Couldn't load saved responses. Showing the automation only."); }
  if (!matchMedia("(max-width:980px)").matches) selected = (reviewable().find(s => stepState(s.id) === "pending") || auto.steps[0]).id;
  render();
}
boot();
})();
</script>
</body>
</html>
