<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Automation Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#16202B; --muted:#5B6775; --line:#DCE2E9; --soft:#F5F7FA;
  --accent:#1D4E89; --accent-soft:#E6EEF8;
  --ok:#13795B; --ok-soft:#E3F4EC; --warn:#9A5B00; --warn-soft:#FDF1DC; --bad:#B42318; --bad-soft:#FDECEA;
  --team:#5B3E96; --team-soft:#EFEAF8;
  --serif:"Source Serif 4", Georgia, serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0E1318; --paper:#161D25; --ink:#E5EAF0; --muted:#9AA6B3; --line:#2A3440; --soft:#1B232C;
    --accent:#86AEE4; --accent-soft:#1B2A3D;
    --ok:#52C79C; --ok-soft:#15302A; --warn:#E5AC55; --warn-soft:#33281A; --bad:#F08A7E; --bad-soft:#3A1E1C;
    --team:#B79CF0; --team-soft:#2A2340;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding-block:12px}
.brand{font-size:13px;color:var(--muted)}
.brand b{color:var(--ink);font-size:15px;display:block}
.autotabs{display:flex;gap:6px;flex-wrap:wrap}
.autotabs a{font-size:14px;text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:7px;border:1px solid transparent;display:inline-flex;gap:8px;align-items:center}
.autotabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;flex:none}
.dot.approved{background:var(--ok)} .dot.changes{background:var(--warn)} .dot.pending{background:var(--accent)}
.banner{font-size:13px;background:var(--warn-soft);color:var(--ink);padding:8px 16px;text-align:center}
.hero{padding-block:26px 18px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-family:var(--serif);font-size:34px;line-height:1.15;margin:6px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);align-items:center}
.lead{font-size:17px;max-width:62ch;margin:12px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--accent-soft);color:var(--accent)}
.pill.changes{background:var(--warn-soft);color:var(--warn)}
.pill.updated{background:var(--team-soft);color:var(--team)}
.pill.approved{background:var(--ok-soft);color:var(--ok)}
.pill.none{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.progress{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
.bar{height:8px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;margin:10px 0 8px;display:flex}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.howto{font-size:13px;color:var(--muted);margin:10px 0 0;padding:0 0 0 18px}
.glance{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.glance div{background:var(--paper);padding:12px 14px;font-size:14px}
.glance b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:22px;align-items:start}
.flow{display:flex;flex-direction:column}
.dayhead{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:18px 0 8px}
.dayhead:first-child{margin-top:0}
.node{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:border-color .15s, box-shadow .15s}
.node:hover{border-color:var(--accent)}
.node[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node.team{background:var(--team-soft);border-color:transparent}
.node.team[aria-pressed="true"]{border-color:var(--team)}
.node.startend{background:var(--soft)}
.icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.node.team .icon{background:var(--paper);color:var(--team)}
.node.startend .icon{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.icon svg{width:20px;height:20px}
.ntitle{font-weight:600;font-size:15px;line-height:1.3}
.nsub{font-size:13px;color:var(--muted);margin-top:2px}
.conn{display:flex;align-items:center;gap:10px;height:30px;margin-left:33px;padding-left:18px;border-left:2px dotted var(--line);font-size:12px;color:var(--muted)}
.inspector{position:sticky;top:16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;max-height:calc(100vh - 32px);overflow:auto}
.inspector.inline{position:static;max-height:none;margin:10px 0 4px;border-color:var(--accent)}
.ihead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.inspector h2{font-family:var(--serif);font-size:22px;line-height:1.25;margin:6px 0 8px}
.inspector p{margin:0 0 10px}
.sms{background:var(--soft);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;white-space:pre-line;font-size:14.5px}
.email{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14.5px}
.email .subj{background:var(--soft);padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.email .body{padding:12px;white-space:pre-line}
.pendingtxt{color:var(--muted);font-style:italic}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 5px;white-space:nowrap}
.len{font-size:12px;color:var(--muted);margin-top:6px}
.note{font-size:13px;margin-top:12px;padding:9px 12px;border-radius:8px;background:var(--warn-soft)}
.note b{color:var(--warn)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.edit[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;gap:8px;margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px}
.form label{font-size:13px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
textarea,input[type=text],input[type=email]{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--paper);font-size:14px}
textarea{resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.hint{font-size:12px;color:var(--muted)}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.hist h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hitem{border-left:3px solid var(--line);padding:4px 0 8px 10px;margin-bottom:8px;font-size:13px}
.hitem.approve{border-color:var(--ok)} .hitem.change{border-color:var(--warn)} .hitem.copy{border-color:var(--accent)}
.hitem .who{font-weight:600}
.hitem .when{color:var(--muted)}
.hitem .copytxt{white-space:pre-line;background:var(--soft);border-radius:6px;padding:6px 8px;margin-top:4px}
.reply{margin-top:8px;background:var(--team-soft);border:1px solid var(--team);border-left:4px solid var(--team);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.45;color:var(--ink,inherit)}
.reply b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--team);margin-bottom:2px}
body.saving .actions button,body.saving form button[type=submit],body.saving [data-q]{pointer-events:none;opacity:.55}
.hitem .old{opacity:.7}
.section{margin-top:34px}
.section h2{font-family:var(--serif);font-size:24px;margin-bottom:6px}
.qs{display:grid;gap:10px;margin-top:12px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.q p{margin:0}
.approveall{background:var(--paper);border:2px solid var(--accent);border-radius:14px;padding:20px;margin-top:12px;display:grid;gap:10px;max-width:720px}
.approveall.done{border-color:var(--ok);background:var(--ok-soft)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.autopick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.autopick label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.autopick select,.adminbar select{font-size:15px;font-weight:600;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);max-width:100%}
.autopick select{min-width:min(360px,100%)}
.signin{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
[hidden]{display:none!important}
.rs{font-weight:700}.rs.done{color:var(--ok)}.rs.prog{color:var(--warn)}.rs.open{color:var(--accent)}
.hitem.isdone{border-color:var(--ok)}
.del{background:none;border:1px solid var(--line);color:var(--bad);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;cursor:pointer}
.del.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .upd{font-size:12px;color:var(--muted)}
.btn.small{padding:5px 10px;font-size:13px}
.adminbar{background:var(--team-soft);border-bottom:1px solid var(--line);font-size:13px}
.adminbar .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:8px}
.adminbar b{color:var(--team)}
.adminbar input{width:220px;padding:5px 8px;font-size:13px}
.adm{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--team);color:var(--team);background:transparent;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:600;cursor:pointer}
.admform{border:1px dashed var(--team);background:var(--team-soft)}
.hadmin{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-top:6px}
.hadmin select,.hadmin input{padding:5px 8px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.okbanner{display:flex;gap:10px;align-items:center;background:var(--ok-soft);color:var(--ink);border:1px solid var(--ok);border-radius:12px;padding:10px 14px;margin-top:12px;font-size:14px}
.okbanner svg{width:22px;height:22px;color:var(--ok);flex:none}
.node.isok .icon{background:var(--ok-soft);color:var(--ok)}
.node.isok{border-color:var(--ok);background:linear-gradient(90deg,var(--ok-soft),var(--paper) 55%)}
.node.isok .pill.approved{background:var(--ok);color:var(--paper)}
.tabok{width:14px;height:14px;color:var(--ok);flex:none}
.edited{font-size:11px;color:var(--team);font-weight:600;margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.foot{margin:40px 0 30px;font-size:12px;color:var(--muted)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  #sideInspector{display:none}
  .glance{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .hero h1{font-size:27px}
  .row2{grid-template-columns:1fr}
  .node{grid-template-columns:34px minmax(0,1fr);}
  .node .pill{grid-column:2;justify-self:start}
  .icon{width:34px;height:34px}
  .conn{margin-left:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>document.write('<script src="config.js?t=' + Date.now() + '"><\/script>');</script>

<body>
<div id="banner" class="banner" hidden></div>
<header class="top"><div class="wrap topin">
  <div class="brand"><b id="clientName">Automation Review</b><span id="clientSub">Law Firm Marketing Pros</span></div>
  <div class="tools"><span class="upd" id="updated"></span><button class="btn small" id="refreshBtn" type="button" title="Load the latest changes from the Sheet">↻ Refresh</button><button class="btn small" id="signinBtn" type="button" data-signin>🔒 Admin login</button></div>
</div>
<div class="wrap" style="padding-bottom:12px"><div class="autopick"><label for="autoSelect">Automation</label><select id="autoSelect"></select><span id="autoCount" class="hint"></span></div></div>
</header>
<div class="adminbar" id="adminbar" hidden><div class="wrap" id="adminbarIn"></div></div>

<main class="wrap" id="app">
  <div class="empty">Loading your review…</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const CFG = window.REVIEW_CONFIG || {};
const SAVE_URL = (CFG.saveUrl || "").trim();
const params = new URLSearchParams(location.search);
const clientKey = (params.get("c") || "").replace(/[^a-z0-9-]/gi, "");
let autoId = params.get("a") || "";

let baseData = null, data = null, auto = null, responses = [], content = [], selected = null, openForm = null, chipChoice = {}, lastLoaded = null;
let wantAdmin = params.has("admin"); let adminClients = [];
let adminKey = ""; try { adminKey = localStorage.getItem("ar_admin_key") || ""; } catch(e){}
let isAdmin = false, adminForm = null, rendered = false;
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="1.8"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const chips = (s) => esc(s).replace(/\[([^\]]+)\]/g, '<span class="chip">$1</span>');
const fmt = (iso) => { try { return new Date(iso).toLocaleString("en-US", {timeZone:"America/New_York", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) + " ET"; } catch(e) { return ""; } };

/* ---------- reviewer identity (per browser) ---------- */
function getReviewer(){ try { return JSON.parse(localStorage.getItem("ar_reviewer") || "{}"); } catch(e){ return {}; } }
function setReviewer(r){ try { localStorage.setItem("ar_reviewer", JSON.stringify(r)); } catch(e){} }

/* ---------- storage: Google Sheet via Apps Script, or demo (this browser) ---------- */
const demoKey = "ar_demo_" + clientKey;
async function loadAll(){
  if (!SAVE_URL){
    let rows = [], cont = [];
    try { rows = JSON.parse(localStorage.getItem(demoKey) || "[]"); cont = JSON.parse(localStorage.getItem(demoKey + "_content") || "[]"); } catch(e){}
    return {rows, content: cont};
  }
  const res = await fetch(SAVE_URL + "?client=" + encodeURIComponent(clientKey) + "&t=" + Date.now(), {cache:"no-store"});
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Could not load responses");
  return {rows: j.rows || [], content: j.content || []};
}
async function loadResponses(){ return (await loadAll()).rows; }
async function postJSON(obj){
  const res = await fetch(SAVE_URL, { method:"POST", body: JSON.stringify(obj) });
  return res.json();
}
/* ---------- admin: content edits and request status ---------- */
async function adminEdit(automation, field, value){
  const who = getReviewer().name || "Admin";
  if (!SAVE_URL){
    const row = {timestamp:new Date().toISOString(), client:clientKey, automation, field, value, edited_by:who};
    const all = (await loadAll()).content; all.push(row);
    try { localStorage.setItem(demoKey + "_content", JSON.stringify(all)); } catch(e){}
    content.push(row); return row;
  }
  const j = await postJSON({action:"admin_edit", key:adminKey, client:clientKey, automation, field, value, name:who});
  if (!j.ok) throw new Error(j.error || "Could not save");
  content.push(j.content); return j.content;
}
async function adminStatus(id, status, reply){
  if (!SAVE_URL){
    const r = responses.find(x => x.id === id); if (r){ r.status = status; r.lfmp_reply = reply; }
    try { localStorage.setItem(demoKey, JSON.stringify(responses)); } catch(e){}
    return;
  }
  const j = await postJSON({action:"admin_status", key:adminKey, client:clientKey, id, status, lfmp_reply:reply});
  if (!j.ok) throw new Error(j.error || "Could not save");
  const i = responses.findIndex(x => x.id === id); if (i > -1) responses[i] = j.row;
}
// Rebuild the automations from the data file plus any admin edits (newest edit wins).
function applyContent(){
  data = JSON.parse(JSON.stringify(baseData));
  content.slice().sort((a,b) => String(a.timestamp).localeCompare(String(b.timestamp))).forEach(c => {
    const a = data.automations.find(x => x.id === c.automation); if (!a) return;
    const f = String(c.field || ""), v = c.value == null ? "" : String(c.value);
    if (["name","summary","version"].includes(f)){ a[f] = v; a._edited = true; return; }
    const m = f.match(/^step:([^:]+):(sms|title|body|email\.subject|email\.body)$/); if (!m) return;
    const st = a.steps.find(x => x.id === m[1]); if (!st) return;
    if (m[2].startsWith("email.")){ st.email = st.email || {subject:"", body:""}; st.email[m[2].slice(6)] = v; }
    else st[m[2]] = v;
    st._edited = true;
  });
  const id = auto ? auto.id : autoId;
  auto = data.automations.find(a => a.id === id) || data.automations[0];
}
async function saveResponse(rec){
  if (!SAVE_URL){
    const all = await loadResponses(); rec.id = "demo-" + Date.now(); rec.timestamp = new Date().toISOString(); rec.status = "Open";
    all.push(rec); try { localStorage.setItem(demoKey, JSON.stringify(all)); } catch(e){}
    return rec;
  }
  const res = await fetch(SAVE_URL, { method:"POST", body: JSON.stringify(rec) }); // text/plain: no CORS preflight
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || "Could not save");
  return j.row;
}

/* ---------- derived state ---------- */
// Google Sheets can turn "1.0" into the number 1, so compare versions both as text and as numbers.
const sameV = (a, b) => String(a) === String(b) || (a !== "" && b !== "" && Number(a) === Number(b));
const mine = () => responses.filter(r => r.automation === auto.id);
const cur = () => mine().filter(r => sameV(r.version, auto.version));
function stepState(stepId){
  const rs = cur().filter(r => r.step === stepId && ["approve","change","copy"].includes(r.action));
  if (!rs.length) return "pending";
  const last = rs[rs.length - 1];
  const openReq = rs.some(r => (r.action === "change" || r.action === "copy") && r.status !== "Done");
  if (openReq) return "changes";
  if (last.action === "approve") return "approved";
  return "updated"; // requests done by LFMP, client hasn't re-approved
}
const stateLabel = {pending:"Needs your review", changes:"Changes requested", updated:"✓ Updated · please re-check", approved:"✓ Looks good"};
function autoState(a){
  const rs = responses.filter(r => r.automation === a.id && sameV(r.version, a.version));
  if (rs.some(r => r.action === "approve_all")) return "approved";
  if (rs.some(r => (r.action === "change" || r.action === "copy") && r.status !== "Done")) return "changes";
  return "pending";
}

/* ---------- actions ---------- */
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2600); }
function readWho(scope){
  const nEl = scope && scope.querySelector('[data-who="name"]'); const eEl = scope && scope.querySelector('[data-who="email"]');
  const r = {name:((nEl&&nEl.value)||getReviewer().name||"").trim(), email:((eEl&&eEl.value)||getReviewer().email||"").trim()};
  if (r.name) setReviewer(r);
  return {r, nEl};
}
// One save at a time: stops double clicks while Google takes a few seconds to answer.
let busy = false;
function lockUI(scope){
  busy = true; document.body.classList.add("saving");
  const b = (scope && scope.querySelector && scope.querySelector("button[type=submit]")) || document.querySelector('[data-act="approve"]');
  if (b){ lockUI.btn = b; lockUI.label = b.textContent; b.textContent = "Saving…"; }
  toast("Saving…");
}
function unlockUI(){
  busy = false; document.body.classList.remove("saving");
  if (lockUI.btn && document.body.contains(lockUI.btn)) lockUI.btn.textContent = lockUI.label;
  lockUI.btn = null;
}
async function guarded(scope, fn){
  if (busy){ toast("Still saving, one moment…"); return; }
  lockUI(scope); try { return await fn(); } finally { unlockUI(); }
}
async function submit(rec, okMsg, scope){
  if (busy){ toast("Still saving, one moment…"); return false; }
  const {r:who, nEl} = readWho(scope);
  if (!who.name){ if (nEl){ nEl.focus(); nEl.setAttribute("aria-invalid","true"); } toast("Please add your name first"); return false; }
  Object.assign(rec, {client:clientKey, automation:auto.id, version:auto.version, name:who.name, email:who.email});
  lockUI(scope);
  try {
    const saved = await saveResponse(rec);
    responses.push(saved);
    unlockUI(); toast(okMsg);
    return true;
  } catch(e){
    unlockUI(); toast("Couldn't save. Check your connection and try again.");
    return false;
  }
}

document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.id === "refreshBtn"){ await refresh(true); return; }
  if (t.dataset.del){
    const id = t.dataset.del;
    if (armed !== id){ armed = id; render(); setTimeout(() => { if (armed === id){ armed = null; render(); } }, 4000); return; }
    armed = null; if (busy){ toast("Still saving, one moment…"); return; }
    busy = true; toast("Deleting…");
    try { await adminDelete([id]); toast("Deleted"); } catch(err){ toast("Couldn't delete: " + err.message); } finally { busy = false; }
    render(); return;
  }
  if (t.hasAttribute("data-clear")){
    if (armed !== "clear"){ armed = "clear"; render(); setTimeout(() => { if (armed === "clear"){ armed = null; render(); } }, 5000); return; }
    armed = null;
    const ids = responses.filter(r => r.automation === auto.id).map(r => r.id);
    if (!ids.length){ toast("Nothing to clear"); render(); return; }
    try { await adminDelete(ids); toast("Cleared " + ids.length + " response" + (ids.length > 1 ? "s" : "")); } catch(err){ toast("Couldn't clear: " + err.message); }
    render(); return;
  }
  if (t.dataset.admin){ adminForm = adminForm === t.dataset.admin ? null : t.dataset.admin; render(); return; }
  if (t.hasAttribute("data-admin-cancel")){ adminForm = null; render(); return; }
  if (t.hasAttribute("data-admin-exit")){ try { localStorage.removeItem("ar_admin_key"); } catch(e){} adminKey = ""; isAdmin = false; adminForm = null; const u = new URL(location.href); u.searchParams.delete("admin"); location.href = u.toString(); return; }
  if (t.hasAttribute("data-signin")){ wantAdmin = true; renderAdminBar(); window.scrollTo(0, 0); const f = $("#ak"); if (f) f.focus(); return; }
  if (t.hasAttribute("data-admin-close")){ wantAdmin = false; renderAdminBar(); return; }
  if (t.dataset.auto){ e.preventDefault(); adminForm = null; autoId = t.dataset.auto; auto = data.automations.find(a=>a.id===autoId); selected = null; openForm = null; history.replaceState(null,"",t.getAttribute("href")); render(); window.scrollTo(0,0); return; }
  if (t.dataset.step){ selected = selected === t.dataset.step && matchMedia("(max-width:980px)").matches ? null : t.dataset.step; openForm = null; render(); return; }
  if (t.dataset.act === "approve"){
    if (!getReviewer().name){ openForm = "who"; render(); const f = $("#rv-name"); if (f) f.focus(); return; }
    await approveStep(null); return;
  }
  if (t.dataset.act === "change" || t.dataset.act === "copy"){ openForm = openForm === t.dataset.act ? null : t.dataset.act; render(); const f = document.getElementById(openForm==="copy"?"f-copy":"f-details"); if (f) f.focus(); return; }
  if (t.hasAttribute("data-cancel")){ openForm = null; render(); return; }
  if (t.dataset.kind){ chipChoice[selected] = t.dataset.kind; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===t)); return; }
  if (t.dataset.q){
    const q = auto.questions.find(x=>x.id===t.dataset.q);
    const ok = await submit({step:q.id, step_title:q.text, action:"answer", type:"Question", details:t.dataset.a, new_copy:""}, "Answer saved", $("#q-who"));
    if (ok) render(); return;
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "autoSelect"){
    adminForm = null; openForm = null; autoId = e.target.value; auto = data.automations.find(a => a.id === autoId);
    selected = matchMedia("(max-width:980px)").matches ? null : (reviewable().find(s => stepState(s.id) === "pending") || auto.steps[0]).id;
    const u = new URL(location.href); u.searchParams.set("a", autoId); history.replaceState(null, "", u.toString());
    render(); window.scrollTo(0, 0);
  }
  if (e.target.id === "clientSelect" && e.target.value && e.target.value !== clientKey){
    const u = new URL(location.href); u.search = "?c=" + encodeURIComponent(e.target.value); location.href = u.toString();
  }
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target; const kind = f.dataset.form;
  const s = auto.steps.find(x=>x.id===selected);
  if (kind === "who"){ await approveStep(f); return; }
  if (kind === "adminkey"){
    const k = $("#ak").value.trim(); if (!k) return;
    const j = await ping(k);
    if (!j.ok){ toast("That password didn't work"); return; }
    adminClients = j.clients || [];
    adminKey = k; isAdmin = true; try { localStorage.setItem("ar_admin_key", k); } catch(e){}
    toast("Admin mode on"); render(); return;
  }
  if (kind === "details"){
    const changes = [["name", $("#ad-name").value.trim()], ["summary", $("#ad-summary").value.trim()], ["version", $("#ad-version").value.trim()]]
      .filter(([k, v]) => v && v !== String(auto[k]));
    if (!changes.length){ adminForm = null; render(); return; }
    await guarded(f, async () => { try { for (const [k, v] of changes) await adminEdit(auto.id, k, v); applyContent(); adminForm = null; unlockUI(); toast("Saved"); render(); }
    catch(err){ toast("Couldn't save: " + err.message); } });
    return;
  }
  if (kind === "copyadmin"){
    const edits = s.sms ? [["sms", $("#ac-sms").value.trim()]] : [["email.subject", $("#ac-subj").value.trim()], ["email.body", $("#ac-body").value.trim()]];
    const cur0 = { "sms": s.sms, "email.subject": s.email && s.email.subject, "email.body": s.email && s.email.body };
    const changes = edits.filter(([k, v]) => v !== String(cur0[k] || ""));
    await guarded(f, async () => { try { for (const [k, v] of changes) await adminEdit(auto.id, "step:" + s.id + ":" + k, v); applyContent(); adminForm = null; unlockUI(); toast(changes.length ? "Copy saved" : "No changes"); render(); }
    catch(err){ toast("Couldn't save: " + err.message); } });
    return;
  }
  if (kind === "status"){
    await guarded(f, async () => { try { await adminStatus(f.dataset.id, f.elements.status.value, f.elements.reply.value.trim()); unlockUI(); toast("Status saved"); render(); }
    catch(err){ toast("Couldn't save: " + err.message); } });
    return;
  }
  if (kind === "change"){
    const d = $("#f-details").value.trim(); if (!d){ $("#f-details").focus(); return; }
    const type = chipChoice[s.id] || "Change timing";
    if (await submit({step:s.id, step_title:s.title, action:"change", type, details:d, new_copy:""}, "Change request sent", f)){ openForm = null; render(); }
  }
  if (kind === "copy"){
    const c = $("#f-copy").value.trim(); const orig = (s.sms || (s.email&&s.email.body) || "").trim();
    if (!c || c === orig){ toast("Edit the wording first, then save"); $("#f-copy").focus(); return; }
    if (await submit({step:s.id, step_title:s.title, action:"copy", type:"New wording", details:$("#f-details").value.trim(), new_copy:c}, "New wording saved", f)){ openForm = null; render(); }
  }
  if (kind === "approve_all"){
    if (!$("#ap-check").checked){ toast("Tick the box to confirm your approval"); return; }
    if (await submit({step:"all", step_title:auto.name, action:"approve_all", type:"Approval", details:"Approved version " + auto.version, new_copy:""}, "Approved. Thank you!", f)){ render(); window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}); }
  }
});
async function approveStep(scope){
  const s = auto.steps.find(x=>x.id===selected);
  const ok = await submit({step:s.id, step_title:s.title, action:"approve", type:"", details:"", new_copy:""}, "Saved: looks good", scope);
  if (!ok) return;
  const i = reviewable().findIndex(x=>x.id===s.id); const next = reviewable().slice(i+1).find(x=>stepState(x.id)==="pending");
  if (next) selected = next.id;
  openForm = null; render();
}
let wasNarrow = matchMedia("(max-width:980px)").matches;
matchMedia("(max-width:980px)").addEventListener("change", (m) => { if (m.matches !== wasNarrow){ wasNarrow = m.matches; if (data) render(); } });

/* ---------- boot ---------- */
async function boot(){
  if (!SAVE_URL){ const b = $("#banner"); b.hidden = false; b.textContent = "Demo mode: responses are saved only in this browser until the Google Sheet connection is set up."; }
  if (!clientKey){ $("#app").innerHTML = '<div class="empty">This review link is missing its client code. Please use the link LFMP sent you.</div>'; return; }
  const ok = await refresh(false);
  if (!ok) return;
  if (adminKey){ // signed in before on this device
    const j = await ping(adminKey);
    if (j.ok){ isAdmin = true; wantAdmin = true; adminClients = j.clients || []; }
  }
  if (!matchMedia("(max-width:980px)").matches) selected = (reviewable().find(s => stepState(s.id) === "pending") || auto.steps[0]).id;
  render();
}
// Reload the data file and everything saved in the Sheet. Used on load and by the Refresh button.
async function refresh(manual){
  const btn = $("#refreshBtn"); if (btn){ btn.disabled = true; btn.textContent = "↻ Refreshing…"; }
  try {
    try {
      const r = await fetch("data/" + clientKey + ".json?t=" + Date.now(), {cache:"no-store"});
      if (!r.ok) throw new Error("not found");
      baseData = await r.json();
    } catch(e){
      if (!baseData){ $("#app").innerHTML = '<div class="empty">We couldn\'t find this review. Please check the link LFMP sent you.</div>'; return false; }
    }
    // Show the automation straight away, then fill in saved responses when the Sheet answers.
    applyContent();
    if (!rendered){
      if (!matchMedia("(max-width:980px)").matches) selected = (reviewable()[0] || auto.steps[0]).id;
      render(); rendered = true;
      $("#updated").textContent = SAVE_URL ? "Loading saved responses…" : "";
    } else if (manual){ $("#updated").textContent = "Refreshing…"; }
    try { const all = await loadAll(); responses = all.rows; content = all.content; lastLoaded = new Date(); }
    catch(e){ toast("Couldn't load saved responses. Try Refresh again in a moment."); }
    applyContent();
    if (selected && !auto.steps.some(x => x.id === selected)) selected = null;
    render(); if (manual) toast("Up to date");
    return true;
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = "↻ Refresh"; }
  }
}
boot();
})();
</script>
