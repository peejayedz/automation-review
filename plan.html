/* Layout: one reading column; brand bar; a wide flow diagram band; numbered routine steps; a day-by-day message grid; message copy in expandable panels; open items last */
:root{
  --bg:#f4f6f9; --logo-bg:#ffffff; --ok-line:#b9dcc6; --surface:#ffffff; --fg:#18212f; --muted:#5a6474; --line:#dce1e8;
  --accent:#2f5d9b; --accent-soft:#e4ecf7; --team:#8a5a14; --team-soft:#f6eddd; --ok:#2e7d4f; --ok-soft:#e3f2e8; --stop:#a23b3b;
  --gold:#c99232; --gold-ink:#1b1f27; --client:var(--client-light, #18212f);
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161e; --surface:#19202b; --fg:#e7ebf1; --muted:#9ba5b4; --line:#2c3543;
  --accent:#7fa8e0; --accent-soft:#1d2a3d; --team:#e0b06a; --team-soft:#3a2d18; --ok:#72c495; --ok-soft:#183324; --stop:#e48c8c;

:root[data-theme="dark"]{
  --bg:#11161e; --surface:#19202b; --fg:#e7ebf1; --muted:#9ba5b4; --line:#2c3543;
  --accent:#7fa8e0; --accent-soft:#1d2a3d; --team:#e0b06a; --team-soft:#3a2d18; --ok:#72c495; --ok-soft:#183324; --stop:#e48c8c;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
.wrap{max-width:920px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:36px}
h1,h2{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,38px);line-height:1.15;margin:6px 0 10px}
h2{font-size:24px}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0;max-width:65ch}
.brands{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand + .brand{padding-left:20px;border-left:1px solid var(--line)}
.lp-word{font:600 22px/1 var(--body);letter-spacing:-.01em;color:var(--fg)}
.lp-word span{color:var(--gold)}
.logo-mask{display:block;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain}
.lfmp-logo{position:relative;width:148px;height:42px}
.lfmp-logo i{position:absolute;inset:0}

.tag.team{background:var(--team-soft);color:var(--team)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
.ba{min-width:620px}

.ba td:nth-child(2){color:var(--muted)}
.days{min-width:600px}
.days td{padding:12px 10px}
.days td:first-child{min-width:150px}
.days td:first-child span{display:block;font-size:13px;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.cta p{flex:1;min-width:220px;font-size:14px;color:var(--muted)}
.cta p b{color:var(--fg)}
.btn{display:inline-block;font-weight:600;font-size:14px;border-radius:8px;padding:9px 14px;background:var(--accent);color:#fff;text-decoration:none;white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.msg{display:grid;grid-template-columns:130px minmax(0,1fr);gap:18px;padding:16px 18px;border-top:1px solid var(--line)}
.msg:first-child{border-top:0}
.msg .when{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-variant-numeric:tabular-nums}
.kind{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.kind.alert{background:var(--team-soft);color:var(--team)}
.msg .body{display:flex;flex-direction:column;gap:8px;min-width:0;overflow-wrap:anywhere}
.msg .subj{font-weight:600}
.field{color:var(--accent);font-weight:600}
.blank{color:var(--team);background:var(--team-soft);border:1px dashed var(--team);border-radius:4px;padding:0 4px;font-weight:600;white-space:nowrap}
.agency-word{font:600 17px/1.2 var(--body);color:var(--fg)}
.agency-logo{display:block;background:var(--agency-ink,var(--fg));-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-position:left center;mask-position:left center}

:root[data-theme="dark"] .agency-logo{background:#ffffff}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 10px;font:500 12px/1 var(--body);cursor:pointer}
.themebtn:hover{color:var(--fg)}
.themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.themebtn svg{width:15px;height:15px}
.qs{display:flex;flex-direction:column;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.q>div{flex:1;min-width:0}
.q .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;display:grid;place-items:center}
.why{font-size:14px;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.rule strong{font-size:15px}
.rule span{font-size:14px;color:var(--muted)}
.checklist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.checklist li{display:flex;gap:10px;align-items:flex-start}
.checklist li::before{content:"";flex:0 0 14px;height:14px;margin-top:5px;border:2px solid var(--accent);border-radius:3px}
.checklist li div{display:flex;flex-direction:column;min-width:0}
.checklist small{font-size:14px;color:var(--muted)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:700px){.split,.rules{grid-template-columns:1fr}.msg{grid-template-columns:minmax(0,1fr);gap:10px}.msg .when{flex-direction:row;align-items:center}.brand + .brand{padding-left:0;border-left:0}}

<div class="wrap">

    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" style="fill:var(--gold)"></rect><path d="M8 24 L14 17 L18 20 L26 11" style="fill:none;stroke:var(--gold-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"></path><path d="M21 11 H26 V16" style="fill:none;stroke:var(--gold-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"></path></svg>
      <span class="lp-word">Lead<span>Pro</span></span>
    </div>
    <div class="brand" id="agency-brand"><span class="logo-mask lfmp-logo" role="img" aria-label="Law Firm Marketing Pros"><i class="logo-mask ink"></i><i class="logo-mask gold"></i></span></div>
    <div class="brand" id="client-brand" hidden></div>
    <button type="button" class="themebtn" id="theme-btn" title="Switch between automatic, light and dark"></button>
  </div>

<header>
  <span class="eyebrow" id="eyebrow"></span>
  <h1 id="page-h1">Loading…</h1>
  <p class="lead" id="page-lead"></p>
  <span class="status" id="page-status" hidden></span>
</header>
<div id="sections" style="display:flex;flex-direction:column;gap:36px"></div>
<footer id="footer-text"></footer>
</div>
<script>
(function(){
"use strict";
/* Plan page (one file for every client): plan.html?c=<code>
   Layout and wording: data/<code>.plan.json. Messages and questions: data/<code>.messages.json (the same file the review page uses). */
const params = new URLSearchParams(location.search);
const code = (params.get("c") || "").replace(/[^a-z0-9-]/gi, "");
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// [Merge field] = blue, filled in for each lead. A name listed in the messages file's "blanks" = amber, still to fill in.
let BLANKS = new Set();
const chips = s => esc(s).replace(/\[([^\]]+)\]/g, (m, k) => BLANKS.has(k) ? '<span class="blank" title="To fill in before go-live">[' + k + ']</span>' : '<span class="field">[' + k + ']</span>');
const bold = s => chips(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
const paras = s => String(s).split(/\n\n+/).map(p => "<p>" + chips(p).replace(/\n/g, "<br>") + "</p>").join("");
function fail(msg){ $("#page-h1").textContent = msg; }
/* Light / dark: Auto follows the device; Light or Dark is remembered in this browser. */
const THEMES = [
  ["auto", "Auto", '<circle cx="12" cy="12" r="8"/><path d="M12 4v16"/><path d="M12 4a8 8 0 0 1 0 16" fill="currentColor" stroke="none"/>'],
  ["light", "Light", '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>'],
  ["dark", "Dark", '<path d="M20 13.5A8.5 8.5 0 1 1 10.5 4a7 7 0 0 0 9.5 9.5Z"/>']
];
function applyTheme(mode, save){
  if (mode === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", mode);
  const t = THEMES.find(x => x[0] === mode) || THEMES[0], btn = $("#theme-btn");
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">' + t[2] + "</svg><span>" + t[1] + "</span>";
  btn.setAttribute("aria-label", "Theme: " + t[1] + ". Click to change.");
  if (save){ try { if (mode === "auto") localStorage.removeItem("ar-theme"); else localStorage.setItem("ar-theme", mode); } catch(e){} }
}
applyTheme(document.documentElement.getAttribute("data-theme") || "auto", false);
$("#theme-btn").addEventListener("click", () => {
  const now = document.documentElement.getAttribute("data-theme") || "auto";
  applyTheme(THEMES[(THEMES.findIndex(x => x[0] === now) + 1) % THEMES.length][0], true);
});
const AGENCIES = { LFMP: "Law Firm Marketing Pros", WPP: "Web Promotion Partners" };
(async function(){
  if (!code){ fail("This link is missing the client code."); return; }
  let P, M;
  try {
    [P, M] = await Promise.all([".plan.json", ".messages.json"].map(x => fetch("data/" + code + x + "?t=" + Date.now(), {cache: "no-store"}).then(r => { if (!r.ok) throw 0; return r.json(); })));
  } catch(e){ fail("We couldn't find this page. Please check the link."); return; }
  const review = P.reviewUrl || ("messages.html?c=" + encodeURIComponent(code));
  BLANKS = new Set((M.blanks || []).map(esc));
  // Agency logo: LFMP (default) or WPP, from the messages file's "agency".
  const agency = AGENCIES[String(M.agency || "LFMP").toUpperCase()] ? String(M.agency || "LFMP").toUpperCase() : "LFMP";
  const agencyName = AGENCIES[agency];
  if (agency !== "LFMP"){
    const L = M.agencyLogo || {}; // {logoMask (transparent PNG data URI), logoWidth, logoHeight, color}: brand colour in light mode, white in dark
    $("#agency-brand").innerHTML = /^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(L.logoMask || "")
      ? '<span class="agency-logo" role="img" aria-label="' + esc(agencyName) + '" style="width:' + (+L.logoWidth || 112) + "px;height:" + (+L.logoHeight || 44) + "px;-webkit-mask-image:url(" + L.logoMask + ");mask-image:url(" + L.logoMask + ")" + (/^#[0-9a-f]{3,8}$/i.test(L.color || "") ? ";--agency-ink:" + L.color : "") + '"></span>'
      : '<span class="agency-word">' + esc(agencyName) + "</span>";
    $("#brands").setAttribute("aria-label", "LeadPro and " + agencyName);
  }
  const b = M.brand || {};
  if (b.logoMask || b.name){
    const slot = $("#client-brand");
    slot.innerHTML = b.logoMask
      ? '<span class="client-logo" role="img" aria-label="' + esc(b.name || "") + '" style="width:' + (+b.logoWidth || 145) + 'px;height:' + (+b.logoHeight || 46) + 'px;-webkit-mask-image:url(' + b.logoMask + ');mask-image:url(' + b.logoMask + ')"></span>'
      : '<span class="firm-word">' + esc(b.name) + '</span>';
    slot.hidden = false;
    if (b.color) document.documentElement.style.setProperty("--client-light", b.color);
    if (b.name) $("#brands").setAttribute("aria-label", "LeadPro, " + agencyName + " and " + b.name);
  }
  document.title = P.pageTitle || P.title || document.title;
  $("#eyebrow").textContent = P.eyebrow || M.eyebrow || (b.name ? b.name + " · LeadPro" : "");
  $("#page-h1").textContent = P.title || "";
  $("#page-lead").innerHTML = bold(P.intro || "");
  if (P.status){ $("#page-status").textContent = P.status; $("#page-status").hidden = false; }
  $("#footer-text").textContent = P.footer || "";
  const cta = P.cta || {};
  const ctaHTML = '<div class="cta"><p>' + bold(cta.text || "**Ready to review?** Mark each message “Looks good” or change the wording on your review page. Your answers save as you go.") + '</p><a class="btn" href="' + esc(review) + '">' + esc(cta.button || "Review the messages →") + '</a></div>';
  const msgRow = m => '<article class="msg"><div class="when">' + esc(m.when) + '<span class="kind ' + esc(String(m.kind).toLowerCase()) + '">' + esc(m.to || m.kind) + '</span></div><div class="body">' + (m.subject ? '<p class="subj">Subject: ' + chips(m.subject) + '</p>' : '') + paras(m.text) + '</div></article>';
  const html = (P.sections || []).map(sec => {
    if (sec.type === "messages"){
      return '<section><h2>' + esc(sec.title || "Every message, word for word") + '</h2>' + (sec.sub ? '<p class="sub">' + chips(sec.sub) + '</p>' : '') + ctaHTML +
        (M.sections || []).map(g => '<h3 style="margin-top:14px">' + esc(g.title) + '</h3>' + (g.sub ? '<p class="sub">' + esc(g.sub) + '</p>' : '') + '<div class="list">' + g.msgs.map(msgRow).join("") + '</div>').join("") +
        (sec.caption ? '<p class="caption">' + esc(sec.caption) + '</p>' : '') + '</section>';
    }
    if (sec.type === "questions"){
      return '<section><h2>' + esc(sec.title || "Open items") + '</h2>' + (sec.sub ? '<p class="sub">' + esc(sec.sub) + '</p>' : '') +
        '<div class="qs">' + (M.questions || []).map((q, i) => '<div class="q"><span class="n">' + (i + 1) + '</span><div><h3>' + esc(q.q) + '</h3>' + (q.why ? '<p class="why">' + esc(q.why) + '</p>' : '') + '</div></div>').join("") + '</div>' + ctaHTML + '</section>';
    }
    return '<section>' + (sec.html || "") + '</section>'; // LFMP-written HTML block (see the handoff for the classes)
  }).join("");
  $("#sections").innerHTML = html;
})();
})();
</script>
